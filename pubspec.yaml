name: offline_network_app
description: "Offline Networking and Disaster Communication Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_spinkit: ^5.2.2

  # State management
  provider: ^6.1.2

  # Date and time formatting
  intl: ^0.19.0

  # Bluetooth and BLE
  flutter_blue_plus: ^1.32.8
  flutter_ble_peripheral: ^1.2.5

  # Location
  geolocator: ^11.0.0

  # Android permissions
  permission_handler: ^11.3.1

  # Local notifications
  flutter_local_notifications: ^17.1.2

  # Small local values such as profile and login status
  shared_preferences: ^2.2.3

  # SQLite local database
  sqflite: ^2.3.3

  # Used to create the SQLite database file path
  path: ^1.9.1

  # Used for accessing application storage directories
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/